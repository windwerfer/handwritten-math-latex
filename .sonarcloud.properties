# SonarCloud automatic analysis (this repo has no CI scanner).
# Limit the score to library code and the train / eval / export pipeline.
# Versioned Kaggle kernels, results, docs and one-off scripts stay out of scope.
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis

sonar.python.version=3.11

# Positive source set, so kaggle/, results/, docs/, runs/ and notebooks are not analysed.
# Automatic analysis docs discourage wildcard patterns in this file.
sonar.sources=hw,scripts
sonar.tests=tests

# One-off scripts that are not part of the shipped training/export pipeline.
sonar.exclusions=scripts/eval_competitors.py,scripts/render_channel_explainers.py,scripts/render_stroke_colour_samples.py
